server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Любой путь, не найденный как файл, отдаём как index.html —
    # иначе обновление страницы на /login или /register даст 404
    # (это особенность client-side роутинга React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
