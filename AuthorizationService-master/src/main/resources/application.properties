spring.application.name=AuthorizationService


spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


spring.config.import=optional:file:.env[.properties]
jwtKey=${SECRET_KEY}


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


spring.flyway.password=postgres
spring.flyway.user=postgres

#Docker
spring.datasource.url=jdbc:postgresql://postgres-auth:5432/auth-db
spring.flyway.url=jdbc:postgresql://postgres-auth:5432/auth-db
server.port=8080

#Local
#spring.flyway.url='jdbc:postgresql://localhost:8080/postgres'
#spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
#server.port=8090
